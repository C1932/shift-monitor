name: PVMG Shift Monitor

on:
  workflow_dispatch:
    # Triggered every 30 minutes by an external cron service (cron-job.org),
    # since GitHub's own built-in schedule trigger proved unreliable for
    # this account - see the long troubleshooting history for details.
    # Can still be run manually from the Actions tab for testing too.

permissions:
  contents: write

jobs:
  check-shifts:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run shift monitor
        env:
          PVMG_EMAIL: ${{ secrets.PVMG_EMAIL }}
          PVMG_PASSWORD: ${{ secrets.PVMG_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AUTO_TAKE_SG: ${{ secrets.AUTO_TAKE_SG }}
          GCAL_ICAL_URL: ${{ secrets.GCAL_ICAL_URL }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python shift_monitor.py

      - name: Upload debug files (only exist if something went wrong)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug_screenshot.png
            debug_page.html
          if-no-files-found: ignore

      - name: Save state back to the repo
        run: |
          git config --global user.name "shift-monitor-bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update shift state [skip ci]"
          git push
